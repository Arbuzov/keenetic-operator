---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: keeneticwebapps.keenetic.whitediver.com
spec:
  group: keenetic.whitediver.com
  names:
    kind: KeeneticWebApp
    listKind: KeeneticWebAppList
    plural: keeneticwebapps
    singular: keeneticwebapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .spec.upstreamAddress
      name: Upstream
      type: string
    - jsonPath: .spec.upstreamPort
      name: Port
      type: integer
    - jsonPath: .spec.securityLevel
      name: Level
      type: string
    - jsonPath: .status.applied
      name: Applied
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KeeneticWebApp — одно опубликованное веб-приложение на Keenetic.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KeeneticWebAppSpec — желаемая запись `ip http proxy` на роутере: публикация
              внутреннего веб-приложения наружу через KeenDNS.

              Это НЕ то же самое, что KeeneticHostRecord. `ip host` — статический DNS для
              LAN: имя резолвится в сам роутер. `ip http proxy` — обратный прокси перед
              приложением: роутер терминирует TLS по сертификату KeenDNS и ходит на
              upstream. Без первой записи имя не резолвится внутри сети; без второй роутер
              не знает, куда проксировать запрос, и отдаёт собственный веб-интерфейс.
            properties:
              auth:
                description: |-
                  Auth — требовать ли авторизацию роутера перед приложением
                  (`auth` / `no auth` в конфиге).
                type: boolean
              domain:
                description: Domain — FQDN, под которым приложение видно снаружи (host
                  из Ingress).
                maxLength: 253
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                type: string
              name:
                description: |-
                  Name — идентификатор записи в конфиге роутера (`ip http proxy <name>`).
                  Роутер держит имя отдельно от домена, и удаление идёт именно по имени, а
                  не по FQDN. Обычно это первая метка домена: notes для
                  notes.example.keenetic.link.
                maxLength: 32
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,31}$
                type: string
              ndns:
                description: |-
                  NDNS — публиковать через `domain ndns`, то есть отдать роутеру собирать
                  имя из его собственной зоны KeenDNS. Только так имя попадает в KeenDNS:
                  запись с `domain static` внутри keenetic.link имя не заявляет, и роутер
                  отвечает на него своим веб-интерфейсом, никак не сообщая об ошибке.
                  Ставится, когда Domain лежит внутри KEENDNS_ZONE.
                type: boolean
              securityLevel:
                default: public
                description: |-
                  SecurityLevel — public: «свободный доступ», имя открыто из интернета.
                  private: снаружи пускает только после входа в веб-интерфейс роутера.
                enum:
                - public
                - private
                type: string
              upstreamAddress:
                description: |-
                  UpstreamAddress — IPv4 внутреннего сервера, куда роутер проксирует.
                  Намеренно отдельно от KeeneticHostRecord.spec.address: там адрес самого
                  роутера (имя должно резолвиться в него, иначе прокси минуется), а здесь —
                  адрес ingress-контроллера за роутером. Свести их в одно поле нельзя.
                pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                type: string
              upstreamPort:
                description: UpstreamPort — TCP-порт upstream'а.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              upstreamScheme:
                default: http
                description: UpstreamScheme — по какому протоколу роутер ходит на
                  upstream.
                enum:
                - http
                - https
                type: string
            required:
            - domain
            - name
            - upstreamAddress
            - upstreamPort
            type: object
          status:
            description: KeeneticWebAppStatus — наблюдаемое состояние.
            properties:
              applied:
                description: Applied — присутствует ли запись на роутере прямо сейчас.
                type: boolean
              appliedName:
                description: |-
                  AppliedName — под каким именем запись реально лежит на роутере.
                  Нужен ровно для одного: роутер ключует `ip http proxy` именем, а по
                  самому роутеру не узнать, какая из его записей была нашей. Без этого
                  поля смена spec.name создаёт запись под новым именем и навсегда бросает
                  старую — finalizer потом удалит только текущее имя. То же по сути, что и
                  уборка прежнего адреса у KeeneticHostRecord, только там прежнее значение
                  видно в конфиге роутера, а здесь — нет.
                type: string
              conditions:
                description: Conditions — стандартный k8s-паттерн (тип Ready и т.п.).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration — поколение spec, на котором последний
                  раз сошлись.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
